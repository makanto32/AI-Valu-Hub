<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Value Hub - Interactive Walkthrough</title>
<style>
:root {
  --bg: #0b1220;
  --panel: #111a2b;
  --panel-2: #16233a;
  --line: #2a3a59;
  --text: #e8eefb;
  --muted: #9fb0cf;
  --blue: #4e8cff;
  --green: #27c59a;
  --amber: #efb24b;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: radial-gradient(1200px 700px at 20% -10%, #1a2b4a, transparent), var(--bg);
  color: var(--text);
  font-family: Segoe UI, Arial, sans-serif;
}
.shell {
  height: 100vh;
  display: grid;
  grid-template-rows: auto 1fr auto;
}
.topbar {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 10px 14px;
  border-bottom: 1px solid var(--line);
  background: rgba(8, 14, 26, 0.95);
}
.brand {
  font-weight: 700;
  white-space: nowrap;
}
.brand span { color: var(--blue); }
.lang-selector {
  display: flex;
  gap: 6px;
  margin-left: auto;
  margin-right: 12px;
}
.lang-btn {
  border: 1px solid var(--line);
  background: #1a2944;
  color: var(--text);
  font-size: 11px;
  font-weight: 600;
  padding: 6px 10px;
  border-radius: 6px;
  cursor: pointer;
  text-transform: uppercase;
  transition: all 0.2s ease;
}
.lang-btn:hover {
  border-color: #4e8cff;
}
.lang-btn.active {
  background: linear-gradient(90deg, #3b6ff0, #7a5ce0);
  border-color: transparent;
  color: #fff;
}
.chapters {
  flex: 1;
  display: flex;
  gap: 6px;
}
.chap {
  height: 6px;
  border-radius: 999px;
  background: #2b3a57;
  flex: 1;
  cursor: pointer;
}
.chap.active { background: var(--blue); }
.chap.done { background: var(--green); }
.timer {
  color: var(--muted);
  font-size: 12px;
  white-space: nowrap;
}
.main {
  min-height: 0;
  display: grid;
  grid-template-columns: 1fr var(--side-width, 360px);
}
.shell.focus-live .main {
  grid-template-columns: 1fr;
}
.stage {
  min-height: 0;
  border-right: 1px solid var(--line);
  display: grid;
  grid-template-rows: auto 1fr;
  position: relative;
}
.shell.focus-live .stage {
  border-right: 0;
}
.stage-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  background: rgba(17, 26, 43, 0.8);
  border-bottom: 1px solid var(--line);
}
.stage-title {
  font-size: 13px;
  font-weight: 600;
}
.live-controls {
  display: flex;
  gap: 8px;
}
.btn {
  border: 1px solid var(--line);
  background: #1a2944;
  color: var(--text);
  font-size: 12px;
  padding: 6px 10px;
  border-radius: 8px;
  cursor: pointer;
}
.btn:hover { border-color: #4e8cff; }
.btn.primary {
  background: linear-gradient(90deg, #3b6ff0, #7a5ce0);
  border-color: transparent;
}
.frame-wrap {
  min-height: 0;
  background: #0a1020;
  overflow: auto;
}
iframe {
  width: calc(100% / var(--frame-scale, 1));
  height: calc(100% / var(--frame-scale, 1));
  border: 0;
  background: #ffffff;
  display: block;
  transform: scale(var(--frame-scale, 1));
  transform-origin: top left;
}
.side {
  min-height: 0;
  display: grid;
  grid-template-rows: auto auto 1fr;
  background: rgba(10, 16, 31, 0.95);
}
.shell.focus-live .side {
  display: none;
}
.side-head {
  padding: 14px;
  border-bottom: 1px solid var(--line);
}
.side-head h2 {
  margin: 0;
  font-size: 16px;
}
.side-head p {
  margin: 6px 0 0;
  color: var(--muted);
  font-size: 12px;
}
.value-box {
  margin: 12px 14px 0;
  border: 1px solid #2e4468;
  border-radius: 10px;
  background: #13213a;
  padding: 10px;
  font-size: 12px;
}
.value-box h3 {
  margin: 0 0 8px;
  font-size: 12px;
  color: #b6d0ff;
}
.value-list {
  margin: 0;
  padding-left: 16px;
  color: #d9e5fb;
  line-height: 1.5;
}
.value-list li {
  position: relative;
  cursor: help;
  transition: color 0.2s ease;
}
.value-list li:hover {
  color: var(--green);
}
.tooltip {
  position: absolute;
  left: 100%;
  top: 50%;
  transform: translateY(-50%);
  margin-left: 12px;
  background: #1a3a5a;
  border: 1px solid var(--blue);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 11px;
  color: #d9e5fb;
  white-space: normal;
  width: 220px;
  z-index: 100;
  pointer-events: none;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.2s ease, visibility 0.2s ease;
  box-shadow: 0 8px 24px rgba(5, 8, 16, 0.6);
  line-height: 1.4;
}
.value-list li:hover .tooltip {
  opacity: 1;
  visibility: visible;
}
.narr {
  min-height: 0;
  overflow: auto;
  padding: 14px;
  color: #dbe5f9;
  line-height: 1.6;
  font-size: 13px;
}
.narr p { margin: 0 0 10px; }
.narr .tip {
  background: rgba(39, 197, 154, 0.12);
  border-left: 3px solid var(--green);
  padding: 8px 10px;
  border-radius: 0 8px 8px 0;
  margin: 10px 0;
}
.narr .warn {
  background: rgba(239, 178, 75, 0.1);
  border-left: 3px solid var(--amber);
  padding: 8px 10px;
  border-radius: 0 8px 8px 0;
  margin: 10px 0;
}
.bottom {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  border-top: 1px solid var(--line);
  background: rgba(8, 14, 26, 0.95);
}
.counter {
  margin-left: auto;
  font-size: 12px;
  color: var(--muted);
}
.fit-label {
  font-size: 12px;
  color: var(--muted);
}
.fit-select {
  border: 1px solid var(--line);
  background: #1a2944;
  color: var(--text);
  font-size: 12px;
  padding: 6px 8px;
  border-radius: 8px;
}
.session-transition {
  position: absolute;
  inset: 0;
  z-index: 10;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(6, 11, 20, 0.74);
  backdrop-filter: blur(6px);
  pointer-events: none;
}
.session-transition.show {
  display: flex;
  animation: transitionFade 1.9s ease forwards;
}
.session-transition-card {
  min-width: 320px;
  max-width: 560px;
  border: 1px solid #3a5687;
  background: linear-gradient(160deg, rgba(17, 32, 58, 0.95), rgba(24, 44, 77, 0.9));
  border-radius: 14px;
  padding: 18px 22px;
  box-shadow: 0 24px 50px rgba(5, 8, 16, 0.45);
}
.session-transition-kicker {
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #9ec0ff;
  margin-bottom: 8px;
}
.session-transition-title {
  font-size: 20px;
  font-weight: 700;
  line-height: 1.2;
  margin-bottom: 8px;
}
.session-transition-sub {
  color: #cfe0ff;
  font-size: 13px;
}
@keyframes transitionFade {
  0% { opacity: 0; }
  12% { opacity: 1; }
  78% { opacity: 1; }
  100% { opacity: 0; }
}
@media (max-width: 1100px) {
  .main { grid-template-columns: 1fr; }
  .side { border-top: 1px solid var(--line); }
}
</style>
</head>

let currentLang = "en";

let playing = true;
let elapsed = 0;

const executedStepActions = new Set();

function getLocalizedText(value, lang = currentLang) {
  if (!value) return "";
  if (typeof value === "string") return value;
  if (typeof value === "object" && value[lang]) return value[lang];
  if (typeof value === "object" && value["en"]) return value["en"];
  return "";
}

function applyFrameScale(scaleValue) {
  const scale = Number(scaleValue);
  const safeScale = Number.isFinite(scale) && scale > 0 ? scale : 1;
  document.documentElement.style.setProperty("--frame-scale", String(safeScale));
}

function syncStepToLiveApp(forceActions = false) {
  const frame = document.getElementById("appFrame");
  const step = STEPS[current];
  if (!frame || !frame.contentWindow || !step?.appState) {
    return;
  }

  const payload = { ...step.appState };
  if (Array.isArray(step.appState.demoActions)) {
    const actionKey = "step-action-" + current;
    const canRunActions = forceActions || !executedStepActions.has(actionKey);
    if (canRunActions) {
      payload.demoActions = step.appState.demoActions;
      executedStepActions.add(actionKey);
    } else {
      delete payload.demoActions;
    }
  }

  frame.contentWindow.postMessage(
    {
      type: "AIHUB_DEMO_NAVIGATE",
      payload,
    },
    "*",
  );

  if (Array.isArray(payload.demoActions) && payload.demoActions.length > 0) {
    const followUpPayload = { ...step.appState };
    delete followUpPayload.demoActions;
    const followUpDelays = [1400, 2800];
    followUpDelays.forEach((delayMs) => setTimeout(() => {
      if (!frame.contentWindow) {
        return;
      }
      frame.contentWindow.postMessage(
        {
          type: "AIHUB_DEMO_NAVIGATE",
          payload: followUpPayload,
        },
        "*",
      );
    }, delayMs));
  }
}

function pickNarratorVoiceForLang(lang) {
  if (!window.speechSynthesis) {
    return null;
  }

  const voices = window.speechSynthesis.getVoices();
  if (!voices || voices.length === 0) {
    return null;
  }

  const langMap = {
    en: ["en-US", "en-GB", "en"],
    es: ["es-ES", "es-MX", "es"],
    pt: ["pt-PT", "pt-BR", "pt"]
  };

  const femaleHints = ["female", "woman", "samantha", "aria", "zira", "jenny", "libby", "eva", "sonia", "susan", "michelle", "katja", "moira", "victoria", "karen"];
  const targetLangs = langMap[lang] || [lang];
  
  let filteredVoices = voices.filter((voice) => {
    const voiceLang = (voice.lang || "").toLowerCase();
    return targetLangs.some(tl => voiceLang.startsWith(tl));
  });

  if (filteredVoices.length === 0) {
    filteredVoices = voices;
  }

  const preferred = filteredVoices.find((voice) => {
    const label = `${voice.name} ${voice.voiceURI}`.toLowerCase();
    return femaleHints.some((hint) => label.includes(hint));
  });

  return preferred || filteredVoices[0] || null;
}

function showSessionTransition(title, subtitle, durationMs = 2100) {
  const overlay = document.getElementById("sessionTransition");
  if (!overlay) {
    return;
  }

  document.getElementById("sessionTransitionTitle").textContent = title;
  document.getElementById("sessionTransitionSub").textContent = subtitle;

  overlay.classList.remove("show");
  void overlay.offsetWidth;
  overlay.classList.add("show");

  if (transitionTimeout) {
    clearTimeout(transitionTimeout);
  }
  transitionTimeout = setTimeout(() => {
    overlay.classList.remove("show");
  }, durationMs);
}

function renderChapters() {
  const wrap = document.getElementById("chapters");
  wrap.innerHTML = "";
  STEPS.forEach((_, idx) => {
    const n = document.createElement("div");
    const cls = idx < current ? "chap done" : idx === current ? "chap active" : "chap";
    n.className = cls;
    n.title = getLocalizedText(STEPS[idx].title);
    n.onclick = () => goTo(idx);
    wrap.appendChild(n);
  });
}

function renderStep() {
  const s = STEPS[current];
  document.getElementById("sceneTitle").textContent = getLocalizedText(s.title);
  document.getElementById("sideHeading").textContent = getLocalizedText(s.heading);

  const valueBox = document.getElementById("valueBox");
  const valueItems = getLocalizedText(s.valueItems);
  const itemsHTML = valueItems.map(i => {
    const description = LANG_TEXTS[currentLang].metricDescriptions[i] || "";
    const tooltipHTML = description ? `<div class="tooltip">${description}</div>` : "";
    return `<li>${i}${tooltipHTML}</li>`;
  }).join("");
  valueBox.innerHTML = "<h3>" + getLocalizedText(s.valueTitle) + "</h3><ul class='value-list'>" + itemsHTML + "</ul>";

  const narr = document.getElementById("narration");
  const textItems = getLocalizedText(s.text);
  narr.innerHTML = textItems.map(t => "<p>" + t + "</p>").join("") +
    "<div class='tip'>" + LANG_TEXTS[currentLang].liveNote(LIVE_URL) + "</div>";

  document.getElementById("counter").textContent = LANG_TEXTS[currentLang].counter(current + 1, STEPS.length);
  renderChapters();
  updateTimer();
  syncStepToLiveApp();
}

function updateTimer() {
  const s = STEPS[current];
  const mm = Math.floor(elapsed / 60);
  const ss = String(elapsed % 60).padStart(2, "0");
  const total = "0:" + String(s.duration).padStart(2, "0");
  document.getElementById("timer").textContent = (playing ? "|| " : "> ") + mm + ":" + ss + " / " + total;
}

function stopSpeech() {
  if (window.speechSynthesis) {
    window.speechSynthesis.cancel();
  }
}

function speakStep() {
  if (!audioEnabled || !window.speechSynthesis) return;
  stopSpeech();
  selectedVoice = pickNarratorVoiceForLang(currentLang);
  const audioText = getLocalizedText(STEPS[current].audio);
  const u = new SpeechSynthesisUtterance(audioText);
  
  const langMap = { en: "en-US", es: "es-ES", pt: "pt-BR" };
  u.lang = langMap[currentLang] || "en-US";
  
  if (selectedVoice) {
    u.voice = selectedVoice;
  }
  u.rate = 0.95;
  u.pitch = 1.1;
  u.volume = 1;
  u.onend = () => {
    if (playing) {
      if (current < STEPS.length - 1) {
        goTo(current + 1);
      } else {
        playing = false;
        document.getElementById("btnPlay").textContent = LANG_TEXTS[currentLang].play;
        if (tick) clearInterval(tick);
      }
    }
  };
  window.speechSynthesis.speak(u);
}

function resetTick() {
  if (tick) clearInterval(tick);
  if (!playing) return;
  tick = setInterval(() => {
    elapsed += 1;
    updateTimer();
    if (elapsed >= STEPS[current].duration) {
      // When audio is on, let speech onend drive advancement — don't cut it off
      if (audioEnabled && window.speechSynthesis && window.speechSynthesis.speaking) return;
      if (current < STEPS.length - 1) {
        goTo(current + 1);
      } else {
        playing = false;
        document.getElementById("btnPlay").textContent = LANG_TEXTS[currentLang].play;
        if (tick) clearInterval(tick);
      }
    }
  }, 1000);
}

function goTo(idx) {
  if (idx < 0 || idx >= STEPS.length) return;
  const previous = current;
  current = idx;
  elapsed = 0;
  renderStep();
  if (previous === 2 && idx === 3) {
    const transitionTitles = {
      en: "Switching to Admin Session",
      es: "Cambio a sesión de admin",
      pt: "Alterando para sessão de administrador"
    };
    const transitionSubs = {
      en: "Closing user context, signing in as admin, and loading dashboard insights.",
      es: "Cerrando contexto de usuario, iniciando sesión como admin y cargando insights del panel.",
      pt: "Fechando contexto do usuário, fazendo login como admin e carregando insights do painel."
    };
    showSessionTransition(
      transitionTitles[currentLang],
      transitionSubs[currentLang],
      2200,
    );
  }
  resetTick();
  speakStep();
}

function updateUIText() {
  document.getElementById("btnPrev").textContent = LANG_TEXTS[currentLang].previous;
  document.getElementById("btnNext").textContent = LANG_TEXTS[currentLang].next;
  document.getElementById("btnRestart").textContent = LANG_TEXTS[currentLang].restart;
  document.getElementById("btnPlay").textContent = playing ? LANG_TEXTS[currentLang].pause : LANG_TEXTS[currentLang].play;
  document.getElementById("btnAudio").textContent = audioEnabled ? LANG_TEXTS[currentLang].audioOn : LANG_TEXTS[currentLang].audioOff;
  document.getElementById("btnOpenApp").textContent = LANG_TEXTS[currentLang].openApp;
  document.getElementById("btnReloadApp").textContent = LANG_TEXTS[currentLang].reloadApp;
  document.getElementById("btnSyncStep").textContent = LANG_TEXTS[currentLang].syncStep;
  document.getElementById("btnFocusLive").textContent = focusLive ? LANG_TEXTS[currentLang].showGuide : LANG_TEXTS[currentLang].focusLive;
  document.querySelector(".fit-label").textContent = LANG_TEXTS[currentLang].fit;
  document.getElementById("timer").textContent = LANG_TEXTS[currentLang].playToStart;
  renderStep();
}

function setLanguage(lang) {
  currentLang = lang;
  selectedVoice = null;
  document.querySelectorAll(".lang-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.lang === lang);
  });
  updateUIText();
  if (audioEnabled) speakStep();
}

document.getElementById("btnPrev").onclick = () => goTo(current - 1);
document.getElementById("btnNext").onclick = () => goTo(current + 1);
document.getElementById("btnRestart").onclick = () => {
  executedStepActions.clear();
  playing = true;
  updateUIText();
  goTo(0);
};
document.getElementById("btnPlay").onclick = () => {
  playing = !playing;
  document.getElementById("btnPlay").textContent = playing ? LANG_TEXTS[currentLang].pause : LANG_TEXTS[currentLang].play;
  if (playing) {
    resetTick();
    speakStep();
  } else {
    if (tick) clearInterval(tick);
    stopSpeech();
  }
};
document.getElementById("btnAudio").onclick = () => {
  audioEnabled = !audioEnabled;
  document.getElementById("btnAudio").textContent = audioEnabled ? LANG_TEXTS[currentLang].audioOn : LANG_TEXTS[currentLang].audioOff;
  if (audioEnabled) speakStep(); else stopSpeech();
};
document.getElementById("btnOpenApp").onclick = () => window.open(LIVE_URL, "_blank");
document.getElementById("btnReloadApp").onclick = () => {
  const frame = document.getElementById("appFrame");
  frame.src = LIVE_URL;
  setTimeout(() => syncStepToLiveApp(true), 700);
};
document.getElementById("btnSyncStep").onclick = () => syncStepToLiveApp(true);
document.getElementById("btnFocusLive").onclick = () => {
  focusLive = !focusLive;
  document.querySelector(".shell").classList.toggle("focus-live", focusLive);
  document.getElementById("btnFocusLive").textContent = focusLive ? LANG_TEXTS[currentLang].showGuide : LANG_TEXTS[currentLang].focusLive;
};

["EN", "ES", "PT"].forEach(langCode => {
  const langId = "lang" + langCode;
  const element = document.getElementById(langId);
  if (element) {
    element.onclick = () => setLanguage(langCode.toLowerCase());
  }
});

document.getElementById("fitScale").onchange = (event) => {
  applyFrameScale(event.target.value);
};

document.getElementById("appFrame").addEventListener("load", () => {
  setTimeout(() => syncStepToLiveApp(true), 350);
});

document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") goTo(current + 1);
  if (e.key === "ArrowLeft") goTo(current - 1);
  if (e.key.toLowerCase() === "p") document.getElementById("btnPlay").click();
});

updateUIText();
applyFrameScale(document.getElementById("fitScale").value);

if (window.speechSynthesis) {
  window.speechSynthesis.onvoiceschanged = () => {
    selectedVoice = pickNarratorVoiceForLang(currentLang);
  };
}
</script>
</body>
</html>
